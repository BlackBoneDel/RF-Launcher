name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 en lugar de ubuntu-latest: Tauri 1.x vincula webkit2gtk-4.0,
        # cuyo paquete de desarrollo (libwebkit2gtk-4.0-dev) está disponible en
        # Ubuntu 22.04 pero fue reemplazado por la 4.1 en Ubuntu 24.04
        # (lo que es el ubuntu-latest actual en 2026). Se documenta en el informe.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust compilation cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "rf-launcher-${{ matrix.os }}"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de sistema (Linux)
        if: "runner.os == 'Linux'"
        run: |
          set -o pipefail
          sudo apt-get update > apt.log 2>&1
          sudo apt-get install -y libwebkit2gtk-4.0-dev > apt_packages.log 2>&1 || sudo apt-get install -y libwebkit2gtk-4.1-dev >> apt_packages.log 2>&1

      - name: Instalar dependencias de frontend
        run: npm ci > npm_ci.log 2>&1
        working-directory: frontend

      - name: Type-check y build del frontend (Vite)
        run: npm run build > npm_build.log 2>&1
        working-directory: frontend

      - name: Build del backend Rust (release)
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee cargo_build.log
        working-directory: src-tauri

      - name: Ejecutar tests de Rust
        run: cargo test 2>&1 | tee cargo_test.log
        working-directory: src-tauri

      - name: Smoke test descarga real de Java 21 desde Adoptium (Linux)
        if: "runner.os == 'Linux'"
        run: cargo test ensure_java_21_downloads_from_adoptium -- --nocapture 2>&1 | tee cargo_smoke.log
        working-directory: src-tauri

      - name: Línea base de RAM del launcher en reposo (Linux)
        if: "runner.os == 'Linux'"
        run: |
          sudo apt-get install -y xvfb > xvfb.log 2>&1
          xvfb-run -a ./target/release/rf-launcher > launcher_ram.log 2>&1 &
          PID=$!
          sleep 10
          echo "=== RSS del launcher en reposo (sin instancias corriendo) ==="
          if [ -d "/proc/$PID" ]; then grep -E 'VmRSS|VmSize|VmPeak' /proc/$PID/status || true; else echo "El proceso no está ejecutándose"; fi >> launcher_ram.log
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true

      - name: Diagnosticar fallo publicar log en issue de GitHub
        if: failure()
        run: |
          {
            echo "## cargo_build.log ($(date -u))"
            cat src-tauri/cargo_build.log 2>/dev/null || true
            echo "## cargo_test.log"
            cat src-tauri/cargo_test.log 2>/dev/null || true
            echo "## apt.log"
            cat apt.log 2>/dev/null || true
            echo "## apt_packages.log"
            cat apt_packages.log 2>/dev/null || true
            echo "## npm_ci.log"
            cat frontend/npm_ci.log 2>/dev/null || true
            echo "## npm_build.log"
            cat frontend/npm_build.log 2>/dev/null || true
          } > /tmp/ci_diag.log
          if [ "$(wc -c < /tmp/ci_diag.log)" -gt 60000 ]; then
            tail -c 60000 /tmp/ci_diag.log > /tmp/ci_diag.trunc && mv /tmp/ci_diag.trunc /tmp/ci_diag.log
          fi
          python3 - <<'EOF'
          import json, os, traceback, urllib.request, urllib.error
          lines = []
          lines.append("GITHUB_TOKEN presente: " + ("sí" if os.environ.get("GITHUB_TOKEN") else "NO"))
          try:
              body_log = open("/tmp/ci_diag.log").read()
          except Exception as e:
              body_log = f"No se pudo leer /tmp/ci_diag.log: {e}"
          title = "CI falló en ${{ matrix.os }}"
          body = body_log
          if len(body) > 60000:
              body = body[-60000:]
          payload = json.dumps({"title": title, "body": body}).encode()
          try:
              req = urllib.request.Request(
                  "https://api.github.com/repos/BlackBoneDel/RF-Launcher/issues",
                  data=payload,
                  headers={"Authorization": "token " + os.environ.get("GITHUB_TOKEN", ""),
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "rf-launcher-ci",
                           "Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req) as resp:
                  lines.append("Issue creado HTTP " + str(resp.status))
          except Exception as e:
              lines.append("Excepción creando issue: " + repr(e))
              payload2 = json.dumps({"title": title + " (error de diagnóstico)", "body": "\n".join(lines)}).encode()
              try:
                  req2 = urllib.request.Request("https://api.github.com/repos/BlackBoneDel/RF-Launcher/issues", data=payload2, headers={"Authorization": "token " + os.environ.get("GITHUB_TOKEN", ""), "Accept": "application/vnd.github+json", "User-Agent": "rf-launcher-ci", "Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req2) as resp:
                      lines.append("Issue de error creado HTTP " + str(resp.status))
              except Exception as e2:
                  lines.append("Fallo total: " + repr(e2))
          print("\n".join(lines))
          EOF
