name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Git Bash está disponible en los tres runners (incluido windows-latest).
    # Sin esto, `tee`, `set -o pipefail` y `2>&1 | tee` fallan en PowerShell.
    shell: bash

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 en lugar de ubuntu-latest: Tauri 1.x enlaza contra
        # webkit2gtk-4.0, cuyo paquete de desarrollo sólo existe en Ubuntu
        # 22.04 (en 24.04 fue sustituido por 4.1). Se documenta en el informe.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "rf-launcher-${{ matrix.os }}"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de sistema (Linux)
        if: "runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - name: Instalar dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Type-check y build del frontend (Vite)
        run: npm run build
        working-directory: frontend

      - name: Build del backend Rust (release)
        run: cargo build --release 2>&1 | tee cargo_build.log
        working-directory: src-tauri

      - name: Tests unitarios de Rust (config, instancia, RAM, mapeo Java)
        run: |
          cargo test -- --nocapture \
            --skip ensure_java_21_downloads_from_adoptium \
            --skip mojang_manifest_major_version_matches_static_table \
            2>&1 | tee cargo_test.log
        working-directory: src-tauri

      - name: Smoke test de red (Adoptium + manifiesto de Mojang, Linux)
        if: "runner.os == 'Linux'"
        run: |
          cargo test ensure_java_21_downloads_from_adoptium -- --nocapture 2>&1 | tee cargo_smoke.log
          cargo test mojang_manifest_major_version_matches_static_table -- --nocapture 2>&1 | tee -a cargo_smoke.log
        working-directory: src-tauri

      - name: Línea base de RAM del launcher en reposo (Linux)
        if: "runner.os == 'Linux'"
        run: |
          set +e
          xvfb-run -a ./target/release/rf-launcher > launcher_ram.log 2>&1 &
          sleep 12
          LPID=$(pgrep -x rf-launcher | head -1)
          echo "=== Launcher en reposo, sin instancias corriendo ===" | tee -a launcher_ram.log
          if [ -n "$LPID" ]; then
            grep -E '^(Name|VmRSS|VmSize|VmPeak|VmHWM):' "/proc/$LPID/status" | tee -a launcher_ram.log
            ps -o pid=,rss=,vsz=,cmd= -p "$LPID" | tee -a launcher_ram.log
            kill "$LPID"
          else
            echo "No se encontró el proceso rf-launcher; revisar launcher_ram.log" | tee -a launcher_ram.log
          fi
          cat launcher_ram.log
        working-directory: src-tauri

      - name: Publicar salida de cargo como anotaciones legibles vía API
        if: failure()
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import os
          paths = ["src-tauri/cargo_build.log", "src-tauri/cargo_test.log", "src-tauri/cargo_smoke.log"]
          text = ""
          for p in paths:
              if os.path.exists(p):
                  text += "\n===== " + p + " =====\n" + open(p, errors="replace").read()
          if not text.strip():
              text = "No se encontraron logs de cargo."
          # Nos quedamos sólo con las líneas de error y su contexto inmediato
          # para que las anotaciones quepan y sean legibles.
          import re, subprocess
          keep = []
          lines = text.splitlines()
          for i, line in enumerate(lines):
              plain = re.sub(r"\x1b\[[0-9;]*m", "", line)
              if re.search(r"(^error|^warning|-->\s|could not compile|expected .* found)", plain):
                  keep.extend(lines[i:i+4])
          if keep:
              text = "\n".join(keep)
          text = text[-48000:]
          def enc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          size = 12000
          chunks = [text[i:i+size] for i in range(0, len(text), size)][:4]
          for i, chunk in enumerate(chunks):
              print(f"::error title=cargo-log-{i}::" + enc(chunk))
          EOF

      - name: Subir logs como artefacto si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}
          path: |
            src-tauri/cargo_build.log
            src-tauri/cargo_test.log
            src-tauri/cargo_smoke.log
            src-tauri/launcher_ram.log
          if-no-files-found: ignore
          retention-days: 14
