# ÚNICO workflow de verificación de esta rama: matriz real Windows/macOS/Linux.
#
# El workflow "Minimal test" (.github/workflows/minimal.yml, añadido en b097e0d
# y borrado en 4c40f16) generó un FALSO VERDE: run 40216745092, `success` con
# un solo job `hello` y ninguna matriz. Para que un ✅ en la pestaña Actions
# nunca vuelva a confundirse con la matriz real:
#   1) este fichero es el único workflow permitido (guardia más abajo), y
#   2) el nombre del workflow dice explícitamente qué verifica.
# Si en el futuro se añade un workflow legítimo, hay que actualizar la guardia
# Y documentarlo: un workflow extra sin matriz es un falso verde en potencia.
#
# Los jobs de Release viven al final de ESTE mismo fichero. Sólo se ejecutan
# con el tag build-v* o workflow_dispatch; no sustituyen a la matriz de tests
# y no pueden fabricar un verde porque dependen de instalar/bundlear en 3 SO.
name: CI Matriz RF Launcher 3 SO (verificación real)

on:
  push:
    branches:
      - '**'
    tags:
      - 'build-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Git Bash está disponible en los tres runners (incluido windows-latest).
    shell: bash

jobs:
  build-and-test:
    # El tag build-v* y workflow_dispatch son disparadores de Release: no
    # duplican la matriz de tests, que ya se ejecutó en el push/PR del código.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/build-v'))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 fijo (no ubuntu-latest): Tauri 2 enlaza contra
        # webkit2gtk-4.1. La etiqueta ubuntu-latest es móvil y puede pasar a
        # Ubuntu 26.04; no se ha verificado allí el paquete 4.1.
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Guardia contra workflows de diagnóstico sin matriz
        shell: bash
        run: |
          set -e
          files=$(ls -1 .github/workflows | grep -E '\.ya?ml$' | sort)
          echo "Workflows presentes:"; echo "$files"
          other=$(echo "$files" | grep -v '^ci.yml$' || true)
          if [ -n "$other" ]; then
            echo "::error title=diagnostic-workflow::Workflow ajeno a la matriz real detectado: $other. Un workflow de diagnóstico produce falsos verdes."
            exit 1
          fi
          echo "OK: ci.yml es el unico workflow; el resultado SI representa la matriz."

      - name: Guardia del cable IPC camelCase (Rust ↔ TS)
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/check_ipc_camel_case.py 2>&1 | tee ipc_wire_check.log

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "rf-launcher-${{ matrix.os }}"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de sistema (Linux)
        if: "runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - name: Instalar dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Verificar Cargo.lock congelado
        shell: bash
        working-directory: src-tauri
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          digest = hashlib.sha256(Path("Cargo.lock").read_bytes()).hexdigest()
          print(f"::notice title=evidence-cargo-lock::CARGO_LOCK_SHA256={digest}")
          PY
          cargo metadata --locked --format-version 1 > /dev/null
          echo "CARGO_LOCKED=OK"

      - name: Type-check y build del frontend (Vite)
        run: npm run build
        working-directory: frontend

      - name: Build del backend Rust (release)
        run: cargo build --locked --release 2>&1 | tee cargo_build.log
        working-directory: src-tauri

      - name: Tests unitarios de Rust (config, instancia, RAM, mapeo Java)
        run: |
          set -o pipefail
          cargo test --locked -- --nocapture \
            --skip ensure_java_21_downloads_from_adoptium \
            --skip mojang_manifest_major_version_matches_static_table \
            2>&1 | tee cargo_test.log
        working-directory: src-tauri

      # Sonda de red INDEPENDIENTE de nuestro código Rust. Permite distinguir
      # "el runner no alcanza Adoptium" de "nuestro pick_asset está mal".
      - name: Sonda de red Adoptium en este runner
        if: always()
        run: |
          set +e
          : > adoptium_probe.log
          case "$RUNNER_OS" in
            Windows) OS=windows;; macOS) OS=mac;; *) OS=linux;;
          esac
          case "$(uname -m)" in arm64|aarch64) ARCH=aarch64;; *) ARCH=x64;; esac
          URL="https://api.adoptium.net/v3/assets/feature_releases/21/ga?os=$OS&architecture=$ARCH&image_type=jdk&jvm_impl=hotspot&vendor=eclipse&heap_size=normal&page_size=5"
          echo "ADOPTIUM_PROBE_OS=$OS ARCH=$ARCH" | tee -a adoptium_probe.log
          echo "ADOPTIUM_PROBE_URL=$URL" | tee -a adoptium_probe.log
          curl -sS --max-time 45 -o adoptium_probe.json \
            -w "ADOPTIUM_PROBE_HTTP=%{http_code} TIME=%{time_total} SIZE=%{size_download}\n" \
            "$URL" 2>&1 | tee -a adoptium_probe.log
          FALLBACK="https://api.adoptium.net/v3/binary/latest/21/ga/$OS/$ARCH/jdk/hotspot/normal/eclipse"
          echo "ADOPTIUM_PROBE_FALLBACK_URL=$FALLBACK" | tee -a adoptium_probe.log
          # Sin -L: solo comprobamos la redirección, sin descargar 200 MB.
          curl -sS -o /dev/null --max-time 40 \
            -w "ADOPTIUM_PROBE_FALLBACK_HTTP=%{http_code} TIME=%{time_total} REDIRECT=%{redirect_url}\n" \
            "$FALLBACK" 2>&1 | tee -a adoptium_probe.log
          python3 - <<'EOF' | tee -a adoptium_probe.log
          import json, os
          try:
              d = json.load(open('adoptium_probe.json'))
              print("ADOPTIUM_PROBE_RELEASES=", len(d) if isinstance(d, list) else type(d).__name__)
              if isinstance(d, list) and d:
                  pkg = d[0].get('binaries', [{}])[0].get('package', {})
                  print("ADOPTIUM_PROBE_FIRST_LINK=", pkg.get('link'))
                  print("ADOPTIUM_PROBE_FIRST_CHECKSUM_LEN=", len(pkg.get('checksum') or ''))
          except Exception as e:
              print("ADOPTIUM_PROBE_PARSE_ERR=", repr(e))
              print("ADOPTIUM_PROBE_BODY_HEAD=", open('adoptium_probe.json', errors='replace').read()[:300])
          EOF
          cat adoptium_probe.log
        working-directory: src-tauri

      # PARTE E: descarga REAL de un JDK desde Adoptium en los 3 SO.
      # Si Adoptium bloquea un runner, este paso FALLA con el error real;
      # no se usa continue-on-error ni se marca como "hecho" en el informe.
      - name: Smoke test de descarga real de JDK 21 desde Adoptium (3 SO)
        run: |
          set -o pipefail
          cargo test --locked ensure_java_21_downloads_from_adoptium -- --nocapture 2>&1 | tee cargo_smoke.log
        working-directory: src-tauri

      # El manifiesto de Mojang es JSON independiente de la plataforma; se
      # verifica una vez (Linux) contra la tabla estática que usan los 3 SO.
      - name: Smoke test del manifiesto de Mojang (Linux)
        if: "runner.os == 'Linux'"
        run: |
          set -o pipefail
          cargo test --locked mojang_manifest_major_version_matches_static_table -- --nocapture 2>&1 | tee cargo_smoke_mojang.log
        working-directory: src-tauri

      # ---------------- Línea base de RAM en reposo, los 3 SO ----------------
      # Cada SO escribe el MISMO fichero clave=valor: src-tauri/ram_baseline.txt
      - name: Línea base de RAM en reposo (Linux)
        if: "!cancelled() && runner.os == 'Linux'"
        run: |
          set +e
          : > ram_baseline.txt
          : > launcher_ram.log
          echo "RAM_IDLE_OS=Linux" >> ram_baseline.txt
          echo "RAM_IDLE_METRIC=VmRSS de /proc/PID/status (KB)" >> ram_baseline.txt
          xvfb-run -a ./target/release/rf-launcher >> launcher_ram.log 2>&1 &
          # Un único muestreo a los 12 s produjo un falso negativo en el run
          # 40516180072: el proceso apareció vivo en el cleanup 1 s después.
          # Reintentamos hasta 20 s antes de declarar BLOCKED.
          LPID=""
          for attempt in $(seq 1 20); do
            LPID=$(pgrep -x rf-launcher | head -1)
            if [ -n "$LPID" ]; then
              echo "RAM_IDLE_WAIT_ATTEMPTS=$attempt" >> ram_baseline.txt
              break
            fi
            sleep 1
          done
          if [ -n "$LPID" ]; then
            MAIN=$(awk '/^VmRSS:/{print $2}' "/proc/$LPID/status")
            TREE=${MAIN:-0}
            for c in $(pgrep -P "$LPID" 2>/dev/null); do
              v=$(awk '/^VmRSS:/{print $2}' "/proc/$c/status" 2>/dev/null)
              TREE=$((TREE + ${v:-0}))
            done
            grep -E '^(Name|VmRSS|VmSize|VmPeak|VmHWM):' "/proc/$LPID/status" >> launcher_ram.log
            ps -o pid=,rss=,vsz=,cmd= -p "$LPID" >> launcher_ram.log
            echo "RAM_IDLE_STATUS=OK" >> ram_baseline.txt
            echo "RAM_IDLE_MAIN_KB=${MAIN:-0}" >> ram_baseline.txt
            echo "RAM_IDLE_TREE_KB=$TREE" >> ram_baseline.txt
            echo "RAM_IDLE_LAUNCH=xvfb-run con proceso principal PID $LPID" >> ram_baseline.txt
            kill "$LPID"
          else
            echo "RAM_IDLE_STATUS=BLOCKED" >> ram_baseline.txt
            tail -c 700 launcher_ram.log | tr '\n' ' ' >> /dev/null
            echo "::warning title=ram-baseline-linux::No se encontro el proceso rf-launcher; revisar launcher_ram.log"
          fi
          echo "--- ram_baseline.txt ---"; cat ram_baseline.txt
        working-directory: src-tauri

      - name: Línea base de RAM en reposo (macOS)
        if: "!cancelled() && runner.os == 'macOS'"
        run: |
          set +e
          : > ram_baseline.txt
          : > launcher_ram.log
          echo "RAM_IDLE_OS=macOS" >> ram_baseline.txt
          echo "RAM_IDLE_METRIC=ps rss (KB), proceso principal más hijos" >> ram_baseline.txt
          APP="$PWD/.rf-launcher-audit/RF Launcher.app"
          mkdir -p "$APP/Contents/MacOS"
          cp ./target/release/rf-launcher "$APP/Contents/MacOS/rf-launcher"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>dev.rf.launcher.audit</string>
            <key>CFBundleExecutable</key><string>rf-launcher</string>
            <key>CFBundleName</key><string>RF Launcher</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
          </dict></plist>
          PLIST
          LAUNCH="app-bundle"
          open "$APP" >> launcher_ram.log 2>&1
          sleep 12
          LPID=$(pgrep -x rf-launcher | head -1)
          if [ -z "$LPID" ]; then
            LAUNCH="binario-directo-tras-fallo-de-app-bundle"
            ./target/release/rf-launcher >> launcher_ram.log 2>&1 &
            sleep 8
            LPID=$(pgrep -x rf-launcher | head -1)
          fi
          if [ -n "$LPID" ]; then
            MAIN=$(ps -o rss= -p "$LPID" | tr -d ' ')
            TREE=${MAIN:-0}
            for c in $(pgrep -P "$LPID" 2>/dev/null); do
              v=$(ps -o rss= -p "$c" 2>/dev/null | tr -d ' ')
              TREE=$((TREE + ${v:-0}))
            done
            ps -o pid=,rss=,vsz=,command= -p "$LPID" >> launcher_ram.log
            echo "RAM_IDLE_STATUS=OK" >> ram_baseline.txt
            echo "RAM_IDLE_MAIN_KB=${MAIN:-0}" >> ram_baseline.txt
            echo "RAM_IDLE_TREE_KB=$TREE" >> ram_baseline.txt
            echo "RAM_IDLE_LAUNCH=$LAUNCH PID $LPID" >> ram_baseline.txt
            kill "$LPID" 2>/dev/null
          else
            echo "RAM_IDLE_STATUS=BLOCKED" >> ram_baseline.txt
            echo "RAM_IDLE_NOTE=$(tail -c 900 launcher_ram.log | tr '\n' ' ')" >> ram_baseline.txt
            echo "::warning title=ram-baseline-macos::No se pudo lanzar la app; ver RAM_IDLE_NOTE y launcher_ram.log"
          fi
          echo "--- ram_baseline.txt ---"; cat ram_baseline.txt
          echo "--- launcher_ram.log (cola) ---"; tail -c 1200 launcher_ram.log
        working-directory: src-tauri

      - name: Línea base de RAM en reposo (Windows)
        if: "!cancelled() && runner.os == 'Windows'"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Content -Path ram_baseline.txt -Value @('RAM_IDLE_OS=Windows','RAM_IDLE_METRIC=WorkingSet64 de Get-Process (KB)')
          Set-Content -Path launcher_ram.log -Value ''
          $exe = (Resolve-Path './target/release/rf-launcher.exe').Path
          $proc = $null
          try {
            $proc = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 12
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "El launcher salio inmediatamente (exit code $($proc.ExitCode))."
            }
            $main = [math]::Round($proc.WorkingSet64 / 1KB)
            $tree = $main
            $children = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $proc.Id })
            foreach ($c in $children) {
              $cp = Get-Process -Id $c.ProcessId -ErrorAction SilentlyContinue
              if ($cp) { $tree += [math]::Round($cp.WorkingSet64 / 1KB) }
            }
            Add-Content -Path launcher_ram.log -Value "PID=$($proc.Id) WorkingSet64=$($proc.WorkingSet64) VirtualMemorySize64=$($proc.VirtualMemorySize64) Children=$($children.Count)"
            Add-Content -Path ram_baseline.txt -Value @(
              'RAM_IDLE_STATUS=OK',
              "RAM_IDLE_MAIN_KB=$main",
              "RAM_IDLE_TREE_KB=$tree",
              "RAM_IDLE_LAUNCH=Start-Process PID $($proc.Id) con $($children.Count) procesos hijo (WebView2)"
            )
          } catch {
            Add-Content -Path launcher_ram.log -Value "ERROR: $($_.Exception.Message)"
            Add-Content -Path ram_baseline.txt -Value @(
              'RAM_IDLE_STATUS=BLOCKED',
              "RAM_IDLE_NOTE=$($_.Exception.Message)"
            )
            Write-Host "::warning title=ram-baseline-windows::No se pudo medir: $($_.Exception.Message)"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
          Write-Host '--- ram_baseline.txt ---'
          Get-Content ram_baseline.txt
        working-directory: src-tauri

      # Smoke ESTRICTO de arranque de Tauri 2: reutiliza el lanzamiento real de
      # las tres plataformas hecho para medir RAM, pero convierte un bloqueo o
      # una salida inmediata en fallo del job. No es una medición tolerante.
      - name: Smoke test estricto de arranque Tauri 2 (3 SO)
        if: always()
        shell: bash
        run: |
          set +e
          out=src-tauri/startup_smoke.txt
          base=src-tauri/ram_baseline.txt
          log=src-tauri/launcher_ram.log
          : > "$out"
          echo "SMOKE_STARTUP_OS=$RUNNER_OS" | tee -a "$out"
          if [ ! -f "$base" ]; then
            echo "SMOKE_STARTUP_STATUS=FAILED (sin ram_baseline.txt)" | tee -a "$out"
            exit 1
          fi
          cat "$base" | tee -a "$out"
          if ! grep -qx 'RAM_IDLE_STATUS=OK' "$base"; then
            echo "SMOKE_STARTUP_STATUS=FAILED (la app no se mantuvo viva)" | tee -a "$out"
            echo "--- launcher_ram.log ---" | tee -a "$out"
            tail -c 2000 "$log" 2>/dev/null | tee -a "$out"
            exit 1
          fi
          if grep -Eiq 'panicked at|Error al ejecutar RF Launcher|thread .*panicked' "$log"; then
            echo "SMOKE_STARTUP_STATUS=FAILED (error runtime en launcher_ram.log)" | tee -a "$out"
            tail -c 2000 "$log" | tee -a "$out"
            exit 1
          fi
          echo "SMOKE_STARTUP_STATUS=OK" | tee -a "$out"
          echo "SMOKE_STARTUP_NOTE=Proceso principal vivo y sin panico/_error fatal en el log" | tee -a "$out"

      # Los logs/artefactos de GitHub redirigen a un blob host que no siempre es
      # alcanzable. Las anotaciones SÍ se leen por API, así que publicamos aquí
      # los números que el informe necesita como evidencia verificable.
      - name: Publicar evidencia medible de esta corrida
        if: always()
        run: |
          python3 - <<'EOF'
          import os, re, platform
          def enc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def notice(title, body):
              print(f"::notice title={title}::" + enc(body[:6000]))
          notice("evidence-env", f"OS={platform.platform()}\ncommit={os.environ.get('GITHUB_SHA','')}")
          for p in ["src-tauri/cargo_test.log", "src-tauri/cargo_smoke.log", "src-tauri/cargo_smoke_mojang.log"]:
              if not os.path.exists(p):
                  notice("evidence-tests", f"[{p}] NO EXISTE (paso no ejecutado en este SO)")
                  continue
              txt = re.sub(r"\x1b\[[0-9;]*m", "", open(p, errors="replace").read())
              lines = txt.splitlines()
              results = [l for l in lines if l.startswith("test result:")]
              failed = [l for l in lines if "FAILED" in l]
              markers = [l for l in lines if re.search(
                  r"(ADOPTIUM_SMOKE|ADOPTIUM_API|ADOPTIUM_DOWNLOAD|MOJANG_SMOKE|"
                  r"RETRY_TEST|KILL_TEST_CHILD_RSS_KB|RAM_FISICA_MB|"
                  r"kill_really_terminates|truncated_download|interrupted_install|THEME_PERSISTENCE|MUTATION_CONTROL)", l)]
              notice("evidence-tests", f"[{p}]\n" + "\n".join((results + failed[:8] + markers[:14]) or ["sin datos"]))
              phys = [l for l in lines if "RAM_FISICA_MB=" in l]
              if phys:
                  notice("evidence-ram-physical", "\n".join(phys))
          p = "src-tauri/adoptium_probe.log"
          if os.path.exists(p):
              notice("evidence-adoptium-probe", open(p, errors="replace").read()[-2500:])
          else:
              notice("evidence-adoptium-probe", "NO EXISTE adoptium_probe.log")
          p = "src-tauri/ram_baseline.txt"
          if os.path.exists(p):
              body = open(p, errors="replace").read()
              notice("evidence-ram-idle", body)
              if "RAM_IDLE_STATUS=BLOCKED" in body:
                  print("::warning title=ram-baseline-blocked::RAM en reposo NO medida en este SO; ver evidence-ram-idle")
          else:
              notice("evidence-ram-idle", "RAM_IDLE_STATUS=BLOCKED (sin fichero ram_baseline.txt)")
              print("::warning title=ram-baseline-blocked::No existe ram_baseline.txt en este SO")
          p = "ipc_wire_check.log"
          if os.path.exists(p):
              notice("evidence-ipc-wire", open(p, errors="replace").read())
          else:
              notice("evidence-ipc-wire", "IPC_WIRE_STATUS=BLOCKED (sin ipc_wire_check.log)")
          p = "src-tauri/launcher_ram.log"
          if os.path.exists(p):
              notice("evidence-ram-log", open(p, errors="replace").read()[-1800:])
          p = "src-tauri/startup_smoke.txt"
          if os.path.exists(p):
              body = open(p, errors="replace").read()
              notice("evidence-startup-smoke", body)
              if "SMOKE_STARTUP_STATUS=OK" not in body:
                  print("::warning title=startup-smoke::Arranque de Tauri 2 NO verificado; ver evidence-startup-smoke")
          else:
              notice("evidence-startup-smoke", "SMOKE_STARTUP_STATUS=BLOCKED (sin startup_smoke.txt)")
          EOF

      - name: Publicar salida de cargo como anotaciones legibles vía API
        if: failure()
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import os, re
          paths = ["ipc_wire_check.log", "src-tauri/cargo_build.log",
                   "src-tauri/cargo_test.log", "src-tauri/cargo_smoke.log",
                   "src-tauri/cargo_smoke_mojang.log"]
          blocks = []
          tail = ""
          for p in paths:
              if not os.path.exists(p):
                  continue
              clean = re.sub(r"\x1b\[[0-9;]*m", "", open(p, errors="replace").read())
              lines = clean.splitlines()
              for i, line in enumerate(lines):
                  if (re.match(r"^error(\[|:)", line)
                      or "could not compile" in line
                      or "FALLO REAL DE DESCARGA" in line
                      or re.search(r"(^failures:|^---- .* stdout ----|FAILED$|panicked at|^test result:)", line)
                      or re.match(r"^test .* FAILED", line)):
                      blocks.append(f"### {p}:{i+1}\n" + "\n".join(lines[i:i+18]))
              tail = clean[-2500:]
          text = "\n\n".join(blocks) if blocks else "(sin lineas 'error' detectadas; cola de los logs)\n" + tail
          text = text[:47000]
          def enc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          size = 12000
          chunks = [text[i:i+size] for i in range(0, len(text), size)][:4]
          for i, chunk in enumerate(chunks):
              print(f"::error title=cargo-log-{i}::" + enc(chunk))
          EOF

      - name: Subir logs como artefacto si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}
          path: |
            ipc_wire_check.log
            src-tauri/cargo_build.log
            src-tauri/cargo_test.log
            src-tauri/cargo_smoke.log
            src-tauri/cargo_smoke_mojang.log
            src-tauri/launcher_ram.log
            src-tauri/startup_smoke.txt
            src-tauri/ram_baseline.txt
            src-tauri/adoptium_probe.log
            src-tauri/adoptium_probe.json
          if-no-files-found: ignore
          retention-days: 14

# El job temporal de cierre de issues se usó UNA SOLA VEZ en el run
# 40444478091 para cerrar #4/#5/#6 tras el 403 del token de integración.
# Se retiró en la auditoría posterior: su marcador en el mensaje de commit era
# reproducible por accidente; el permiso de escritura de issues ya no vive aquí.

  # Módulo A / Fase 3-A.2 sub-ronda 1: E2E real Linux-only.
  # No usa mocks de invoke: compila el binario con --features e2e, lo lanza
  # mediante tauri-driver + WebKitWebDriver bajo xvfb y dispara clicks reales.
  e2e-linux:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/build-v'))
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "rf-launcher-e2e-linux"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Dependencias de sistema + WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb webkit2gtk-driver tar
          command -v WebKitWebDriver || command -v webkit2gtk-driver || true

      - name: Instalar dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Build del frontend
        run: npm run build
        working-directory: frontend

      - name: Instalar dependencias E2E
        run: npm ci
        working-directory: e2e

      - name: Instalar tauri-driver
        run: cargo install tauri-driver --locked

      - name: Validar fixtures de catálogo (offline)
        run: python3 scripts/verify_catalog_fixtures.py

      - name: "Smoke de red real - Mojang v2 + Fabric meta"
        run: python3 scripts/verify_catalog_fixtures.py --live

      - name: Compilar binario E2E release-mode (feature flag, NO bundle)
        run: cargo build --locked --release --features e2e
        working-directory: src-tauri

      - name: E2E real UI -> IPC -> backend (xvfb)
        env:
          RUST_BACKTRACE: "1"
          TAURI_DRIVER: /home/runner/.cargo/bin/tauri-driver
          WEBKIT_WEBDRIVER: /usr/bin/WebKitWebDriver
        run: |
          set -o pipefail
          xvfb-run -a npm test 2>&1 | tee wdio.log
        working-directory: e2e

      - name: Subir logs E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-logs
          path: |
            e2e/wdio.log
            .e2e-home/**/*.log
            .e2e-java.pid
          if-no-files-found: ignore

  # ------------------------- Release controlado -------------------------
  # Estos dos jobs viven en el MISMO workflow para no reintroducir un segundo
  # YAML que la guardia anti-falsos verdes tendría que vigilar. Sólo corren con
  # el tag build-v* o con workflow_dispatch manual; nunca en un push normal.
  build-installers:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build-v')) || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            mandatory_bundles: nsis
            optional_bundles: msi
            artifact: installer-windows
          - os: macos-latest
            mandatory_bundles: dmg
            optional_bundles: app
            artifact: installer-macos
          - os: ubuntu-24.04
            mandatory_bundles: deb
            optional_bundles: appimage
            artifact: installer-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer manifiesto de release
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('.github/release-manifest.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for key in ('version', 'release_tag', 'target_sha', 'build_trigger_tag', 'product_name'):
                  f.write(f"{key}={manifest[key]}\n")
          PY

      - name: Instalar Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache de compilación Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: "rf-launcher-release-${{ matrix.os }}"

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb patchelf squashfs-tools
          # AppImage es opcional: si el runner no tiene el paquete FUSE exacto,
          # no debe impedir el .deb obligatorio.
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Instalar dependencias de frontend
        run: npm ci
        working-directory: frontend

      - name: Verificar Cargo.lock antes de empaquetar
        shell: bash
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Build obligatorio de instalador Tauri 2
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2.12.4 build \
            --ci --no-sign --bundles ${{ matrix.mandatory_bundles }} 2>&1 | tee tauri-build.log

      - name: Bundle opcional por SO (no bloqueante)
        if: matrix.optional_bundles != ''
        continue-on-error: true
        shell: bash
        working-directory: src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -o pipefail
          npx --yes @tauri-apps/cli@2.12.4 build \
            --ci --no-sign --bundles ${{ matrix.optional_bundles }} 2>&1 | tee -a tauri-build.log

      - name: Publicar log del bundle si falla
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src-tauri/tauri-build.log')
          text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else '(sin tauri-build.log)'
          enc = text[-12000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::error title=tauri-build-log-${{ matrix.os }}::OS=${{ matrix.os }}%0A" + enc)
          PY

      - name: Recoger instaladores, zip de .app y hashes locales
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, platform, re, shutil, zipfile
          from pathlib import Path
          root = Path('src-tauri/target/release/bundle')
          out = Path('release-assets')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()
          system = platform.system()
          os_name = {'Windows': 'windows', 'Darwin': 'macos', 'Linux': 'linux'}[system]
          machine = platform.machine()
          arch = {
              'x86_64': 'x86_64', 'AMD64': 'x86_64', 'amd64': 'x86_64',
              'arm64': 'aarch64', 'aarch64': 'aarch64',
          }.get(machine, machine)
          exts = {'.msi', '.exe', '.dmg', '.deb', '.appimage', '.zip'}
          copied = []
          for p in sorted(root.rglob('*')):
              if p.is_file() and p.suffix.lower() in exts:
                  safe = re.sub(r'[^A-Za-z0-9._-]+', '-', p.name)
                  dest = out / f"{os_name}-{arch}-{safe}"
                  shutil.copy2(p, dest)
                  copied.append(dest)
          if os_name == 'macos':
              app_dirs = [p for p in sorted(root.rglob('*.app')) if p.is_dir()]
              if app_dirs:
                  zpath = out / f"macos-{arch}-RF-Launcher.app.zip"
                  with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED) as z:
                      for f in app_dirs[0].rglob('*'):
                          if f.is_file():
                              z.write(f, f.relative_to(app_dirs[0].parent))
                  copied.append(zpath)
          if not copied:
              raise SystemExit('ERROR: no se generó ningún instalador nativo')
          lines = []
          for f in sorted(out.iterdir()):
              digest = hashlib.sha256(f.read_bytes()).hexdigest()
              lines.append(f"{digest}  {f.name}")
              print(f"INSTALLER {f.name} size={f.stat().st_size} sha256={digest}")
          Path('installer-hashes.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f"INSTALLER_COUNT={len(copied)}")
          PY

      - name: Publicar evidencia de instaladores
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          body = Path('installer-hashes.txt').read_text(encoding='utf-8')
          enc = body.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f"::notice title=evidence-installers::OS=${{ matrix.os }}%0A" + enc)
          PY

      - name: Subir instaladores como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Subir logs del bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-log-${{ matrix.os }}
          path: |
            src-tauri/tauri-build.log
            installer-hashes.txt
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    needs: build-installers
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build-v')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Leer manifiesto de release
        id: release
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('.github/release-manifest.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for key in ('version', 'release_tag', 'target_sha', 'build_trigger_tag', 'product_name'):
                  f.write(f"{key}={manifest[key]}\n")
          PY

      - name: Descargar instaladores de los 3 SO
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets

      - name: Verificar cobertura mínima de formatos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = sorted(p for p in Path('release-assets').iterdir() if p.is_file())
          names = [p.name.lower() for p in files]
          print('ASSETS_FROM_MATRIX=' + ','.join(p.name for p in files))
          assert any(n.endswith(('.msi', '.exe')) for n in names), 'falta instalador Windows .msi/.exe'
          assert any(n.endswith('.dmg') for n in names), 'falta instalador macOS .dmg'
          assert any(n.endswith(('.deb', '.appimage')) for n in names), 'falta instalador Linux .deb/.AppImage'
          print('MINIMUM_FORMAT_COVERAGE=OK')
          PY

      - name: Generar SHA256SUMS y notas del Release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_NAME: ${{ steps.release.outputs.product_name }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          out = Path('release-assets')
          rows = []
          sums = []
          for f in sorted(out.iterdir()):
              if not f.is_file() or f.name == 'SHA256SUMS.txt':
                  continue
              digest = hashlib.sha256(f.read_bytes()).hexdigest()
              sums.append(f"{digest}  {f.name}")
              rows.append((f.name, f.stat().st_size, digest))
          (out / 'SHA256SUMS.txt').write_text('\n'.join(sums) + '\n', encoding='utf-8')
          tag = os.environ['RELEASE_TAG']
          sha = os.environ['TARGET_SHA']
          version = os.environ['VERSION']
          product = os.environ['PRODUCT_NAME']
          run_id = os.environ['RUN_ID']
          lines = [
              f'# {product} {version}',
              '',
              f'- Release tag: `{tag}`',
              f'- `target_commitish` / SHA de `main`: `{sha}`',
              f'- Workflow run: `{run_id}`',
              '- Repo: **público**; no hace falta sesión autenticada para descargar los assets.',
              '',
              '## Incluido',
              '',
              '- Fase 3-A: instancias vanilla/Fabric, configuración jerárquica, RAM física real,',
              '  Java automático vía Adoptium, temas claro/oscuro y terminación verificada de procesos.',
              '- Deuda técnica cerrada: migración a **Tauri 2**, rechazo duro de **100 % o más**',
              '  de RAM física (`>=`), y cable IPC unificado a **camelCase** con aliases legacy.',
              '- Instaladores nativos sin firmar para Windows, macOS y Linux.',
              '',
              '## NO incluido',
              '',
              '- **Fase 3-B aún no iniciada**: no hay mod loaders adicionales, mods, modpacks,',
              '  cuentas, OAuth ni integración con el mod hermano.',
              '- No hay firma de código ni notarización: SmartScreen/Gatekeeper pueden avisar.',
              '- No se ha ejecutado una instalación interactiva en un sistema limpio desde CI;',
              '  eso se cubre con la checklist manual del Release.',
              '',
              '## Assets y SHA-256',
              '',
              '| Asset | Tamaño (bytes) | SHA-256 |',
              '|---|---:|---|',
          ]
          for name, size, digest in rows:
              lines.append(f'| `{name}` | {size} | `{digest}` |')
          lines += [
              '',
              '`SHA256SUMS.txt` también se publica como asset. El workflow descarga los assets',
              'ya publicados y ejecuta `sha256sum -c`; además compara el `digest` de la API',
              'de GitHub cuando está disponible.',
              '',
              '> Procedencia: los instaladores se construyeron desde el commit de trabajo del PR',
              '> que contiene los ajustes de metadata y este workflow. El tag del Release apunta',
              '> al SHA de `main` indicado arriba; el PR permanece abierto para revisión.',
              '',
              '## Checklist de prueba manual',
              '',
          ]
          lines.append(Path('RELEASE-0.1.0-MANUAL-CHECKLIST.md').read_text(encoding='utf-8'))
          Path('release_notes.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'NOTES_BYTES={Path("release_notes.md").stat().st_size}')
          for row in rows:
              print(f'LOCAL_HASH {row[0]} {row[1]} {row[2]}')
          PY

      - name: Crear o actualizar Release v0.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          PRODUCT_NAME: ${{ steps.release.outputs.product_name }}
        shell: bash
        run: |
          set -e
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RELEASE_EXISTED=1: actualizando notas y assets"
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$PRODUCT_NAME $VERSION" --notes-file release_notes.md
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              release-assets/* --clobber
          else
            echo "RELEASE_EXISTED=0: creando Release apuntando a $TARGET_SHA"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$PRODUCT_NAME $VERSION" \
              --notes-file release_notes.md \
              release-assets/*
          fi

      - name: "Verificación end-to-end: descargar asset publicado y comparar hash"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        shell: bash
        run: |
          set -e
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir downloaded --pattern '*' --clobber
          (cd downloaded && sha256sum -c SHA256SUMS.txt) | tee download-verify.log
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[] | [.name,.size,.digest] | @tsv' > remote_assets.tsv
          git fetch origin main
          git fetch --tags origin
          MAIN_SHA=$(git rev-parse origin/main)
          TAG_COMMIT=$(git rev-parse "$RELEASE_TAG^{commit}")
          TARGET_COMMITISH=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.target_commitish')
          if git rev-parse "$TARGET_COMMITISH^{commit}" >/dev/null 2>&1; then
            TARGET_COMMITISH_SHA=$(git rev-parse "$TARGET_COMMITISH^{commit}")
          else
            TARGET_COMMITISH_SHA="$TARGET_COMMITISH"
          fi
          export MAIN_SHA TAG_COMMIT TARGET_COMMITISH TARGET_COMMITISH_SHA
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          target = os.environ['TARGET_SHA']
          lines = [f"TARGET_SHA={target}"]
          lines.append(f"TARGET_COMMITISH_RAW={os.environ['TARGET_COMMITISH']}")
          checks = {
              'MAIN_SHA': os.environ['MAIN_SHA'],
              'TAG_COMMIT': os.environ['TAG_COMMIT'],
              'TARGET_COMMITISH_SHA': os.environ['TARGET_COMMITISH_SHA'],
          }
          for key, value in checks.items():
              lines.append(f"{key}={value}")
              if value != target:
                  raise SystemExit(f"ERROR: {key} no apunta a {target}: {value}")
          api_matches = 0
          api_null = 0
          for raw in Path('remote_assets.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) < 3:
                  continue
              name, size, digest = parts[0], parts[1], parts[2]
              local = Path('downloaded') / name
              actual = hashlib.sha256(local.read_bytes()).hexdigest()
              lines.append(f"DOWNLOADED {name} size={size} sha256={actual}")
              if not digest or digest == 'null':
                  api_null += 1
                  lines.append(f"API_DIGEST_MISSING {name}")
              elif digest == f"sha256:{actual}":
                  api_matches += 1
                  lines.append(f"API_DIGEST_OK {name}")
              else:
                  raise SystemExit(f"ERROR: digest API {digest} != sha256:{actual} for {name}")
          lines.append(f"API_DIGEST_MATCHES={api_matches}")
          lines.append(f"API_DIGEST_NULL={api_null}")
          lines.append("SHA256_DOWNLOAD_CHECK=OK")
          lines.append("RELEASE_SHA_THREE_METHODS=OK")
          text = '\n'.join(lines) + '\n'
          Path('release_verification.txt').write_text(text, encoding='utf-8')
          enc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print("::notice title=evidence-release-e2e::" + enc)
          print(text)
          PY

      - name: Subir evidencia de verificación del Release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            release_notes.md
            release_verification.txt
            download-verify.log
            remote_assets.tsv
          if-no-files-found: ignore
          retention-days: 30
