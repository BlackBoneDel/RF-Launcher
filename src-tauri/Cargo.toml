[package]
name = "rf-launcher"
version = "0.1.0"
edition = "2021"

# Backend nativo de RF Launcher (Tauri 1.x). Toda la lógica de negocio vive aquí;
# el frontend (React + Vite) solo llama a comandos #[tauri::command].

[dependencies]
tauri = { version = "1.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde", "fmt"] }
sysinfo = "0.32"
reqwest = { version = "0.12", features = ["json"] }
flate2 = "1"
tar = "0.4"
zip = { version = "1.1", features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
thiserror = "1"

[build-dependencies]
tauri-build = { version = "1.8" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[profile.release]
